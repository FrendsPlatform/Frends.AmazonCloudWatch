name: GetMetricData main release
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.AmazonCloudWatch.GetMetricData/**'
      - '.github/workflows/GetMetricData*.yml'
  workflow_dispatch:

jobs:
  main_pipeline:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: main
      os: all
      workdir: Frends.AmazonCloudWatch.GetMetricData
      env_var_name_1: AWS_ACCESS_KEY_ID
      env_var_name_2: AWS_SECRET_ACCESS_KEY
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      target_feed_api_key: ${{ secrets.TASKS_FEED_API_KEY }}
      env_var_value_1: ${{ secrets.AWS_ACCESS_KEY_ID }}
      env_var_value_2: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
