name: PutMetricData test publish
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Frends.AmazonCloudWatch.PutMetricData/**'
      - '.github/workflows/PutMetricData*.yml'
  workflow_dispatch:

jobs:
  work_push:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: work
      os: all
      workdir: Frends.AmazonCloudWatch.PutMetricData
      env_var_name_1: AWS_ACCESS_KEY_ID
      env_var_name_2: AWS_SECRET_ACCESS_KEY
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      target_feed_api_key: ${{ secrets.TASKS_TEST_FEED_API_KEY }}
      env_var_value_1: ${{ secrets.AWS_ACCESS_KEY_ID }}
      env_var_value_2: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
